[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autorecon-api-mode"
version = "0.1.0"
description = "API reconnaissance mode for AutoRecon"
requires-python = ">=3.9"
dependencies = [
  "requests>=2.31.0",
  "PyYAML>=6.0.1",
]

[project.scripts]
autorecon = "autoRecon:main"

[tool.setuptools]
py-modules = ["autoRecon", "dirsearch"]
packages = ["api_recon"]
